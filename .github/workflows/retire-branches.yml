name: Retire superseded development branches (one-time)

on:
  push:
    branches: [Production]
    paths:
      - .github/workflows/retire-branches.yml

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the reviewed superseded refs (with SHA guard)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Exact known heads are a lease: refuse to delete a branch if it moved.
          declare -A expected=(
            ["feature/architecture-and-observer-phase1"]="d8853295b3ae426e647887a458e6ccbd5259bf8f"
            ["feature/native-cpp-tray-and-display-modes"]="a4d4ef9c54a99b6316bd482ed363ed87e0b801b3"
            ["feature/native-reliability-recovery-drift-reconnect"]="c3c282eb11a40670746e9a8bd06b44da9546b86c"
          )
          for branch in "feature/architecture-and-observer-phase1" "feature/native-cpp-tray-and-display-modes" "feature/native-reliability-recovery-drift-reconnect"; do
            ref="heads/$branch"
            actual="$(gh api "repos/$REPO/git/ref/$ref" --jq '.object.sha')"
            if [[ "$actual" != "${expected[$branch]}" ]]; then
              echo "REF CHANGED: $branch, refusing deletion" >&2
              exit 1
            fi
            echo "Retiring reviewed branch $branch ($actual)"
            gh api -X DELETE "repos/$REPO/git/refs/$ref"
          done
          echo "Historical commits and merged PRs remain in GitHub history."
