name: Publish verified Windows MSI release

on:
  workflow_dispatch:
  push:
    branches: [Production]

permissions:
  contents: write
  actions: read

jobs:
  release:
    # A deliberate release commit is an alternative to manual dispatch.
    # Other Production pushes never publish a release.
    if: github.ref == 'refs/heads/Production' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-release]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select successful Production CI for this exact commit
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Production build and release workflows may start at the same time.
          # Wait for this exact commit's native CI result; fail closed if it
          # fails, is cancelled, or remains unverified.
          run=""
          for attempt in $(seq 1 60); do
            response="$(gh api "repos/$REPO/actions/workflows/native-ci.yml/runs?branch=Production&per_page=100")"
            run="$(jq -r --arg sha "$HEAD_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .conclusion == "success")] | first | .id // empty' <<< "$response")"
            if [[ -n "$run" ]]; then break; fi
            state="$(jq -r --arg sha "$HEAD_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha and .event == "push")] | first | .conclusion // empty' <<< "$response")"
            if [[ "$state" == "failure" || "$state" == "cancelled" || "$state" == "timed_out" ]]; then
              echo "Production CI did not pass for $HEAD_SHA ($state)" >&2
              exit 1
            fi
            echo "Waiting for verified Production CI (attempt $attempt/60)"
            sleep 10
          done
          if [[ -z "$run" ]]; then
            echo "No successful Production push CI run for $HEAD_SHA" >&2
            exit 1
          fi
          echo "run_id=$run" >> "$GITHUB_OUTPUT"
          echo "Using verified Production CI run $run ($HEAD_SHA)"

      - name: Download CI-produced MSI (do not rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # upload-artifact@v7 with archive:false publishes under the
          # versioned MSI filename, not the old StreamDisplayManager-MSI label.
          artifact_record="$(gh api "repos/${{ github.repository }}/actions/runs/${{ steps.verify.outputs.run_id }}/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name | test("^StreamDisplayManager-Setup-1\\.0\\.[0-9]+-x64\\.msi$"))] | if length == 1 then (.[0].id | tostring) + " " + .[0].name else empty end')"
          if [[ -z "$artifact_record" ]]; then
            echo "Expected exactly one versioned MSI artifact from verified CI" >&2
            exit 1
          fi
          read -r artifact_id artifact <<< "$artifact_record"
          # upload-artifact@v7 archive:false stores a raw MSI instead of a ZIP.
          # Download the artifact bytes directly; accept either packaging form.
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" \
            -o dist/download.bin
          header="$(xxd -p -l 8 dist/download.bin)"
          if [[ "$header" == "d0cf11e0a1b11ae1" ]]; then
            mv dist/download.bin "dist/$artifact"
          elif [[ "${header:0:8}" == "504b0304" ]]; then
            unzip -p dist/download.bin "$artifact" > "dist/$artifact"
            rm dist/download.bin
          else
            echo "Downloaded artifact is neither raw MSI nor ZIP (header $header)" >&2
            exit 1
          fi
          [[ "$(xxd -p -l 8 "dist/$artifact")" == "d0cf11e0a1b11ae1" ]] || {
            echo "Downloaded payload is not a Windows MSI" >&2
            exit 1
          }
          mapfile -t msis < <(find dist -type f -name 'StreamDisplayManager-Setup-*-x64.msi')
          if [[ "${#msis[@]}" -ne 1 ]]; then
            echo "Expected one verified MSI, got ${#msis[@]}" >&2
            exit 1
          fi
          file="$(basename "${msis[0]}")"
          if [[ ! "$file" =~ ^StreamDisplayManager-Setup-(1\.0\.[0-9]+)-x64\.msi$ ]]; then
            echo "Unexpected MSI filename: $file" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "MSI_PATH=${msis[0]}" >> "$GITHUB_ENV"
          ( cd dist && sha256sum "$file" ) | tee dist/SHA256SUMS

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite immutable asset" >&2
            exit 1
          fi
          gh release create "$tag" "$MSI_PATH" dist/SHA256SUMS \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Stream Display Manager $VERSION" \
            --notes "Verified native Windows x64 MSI from successful Production CI run ${{ steps.verify.outputs.run_id }} (commit ${{ github.sha }}). No .NET runtime required. Download the MSI, then install or upgrade normally. Includes native executable version metadata and Windows login startup."
          echo "Published $tag from verified Production CI asset"
