name: Windows build, tests and MSI

on:
  push:
    branches: [Production]
  pull_request:
    branches: [Production]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore StreamDisplayManager.slnx
      - name: Build
        run: dotnet build StreamDisplayManager.slnx --configuration Release --no-restore
      - name: Run core specification checks
        run: dotnet run --project tests/StreamDisplayManager.Core.SpecTests --configuration Release --no-build
      - name: Set MSI version
        shell: pwsh
        run: |
          $version = "0.1.$env:GITHUB_RUN_NUMBER"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid MSI version" }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Publish self-contained Windows x64 tray app
        shell: pwsh
        run: |
          dotnet publish src/StreamDisplayManager.App/StreamDisplayManager.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=$env:APP_VERSION -o dist
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          if (-not (Test-Path dist/StreamDisplayManager.App.exe)) { throw "Published EXE missing" }
      - name: Build WiX 5 per-user MSI
        shell: pwsh
        run: |
          dotnet build installer/StreamDisplayManager.wixproj -c Release -p:StreamDisplayManagerVersion=$env:APP_VERSION
          if ($LASTEXITCODE -ne 0) { throw "WiX build failed" }
      - name: Inspect and stage MSI
        shell: pwsh
        run: |
          $msis = @(Get-ChildItem installer-output -Filter '*.msi' -Recurse)
          if ($msis.Count -ne 1) { throw "Expected one MSI; found $($msis.Count)" }
          $expected = "StreamDisplayManager-Setup-$env:APP_VERSION-x64.msi"
          if ($msis[0].Name -ne $expected) { throw "Unexpected MSI filename: $($msis[0].Name)" }
          ./scripts/Test-Msi.ps1 -MsiPath $msis[0].FullName -ExpectedVersion $env:APP_VERSION
          New-Item -ItemType Directory -Force -Path release-output | Out-Null
          Copy-Item -LiteralPath $msis[0].FullName -Destination (Join-Path release-output $expected)
      - name: MSI install/uninstall smoke test
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem release-output -Filter '*.msi') | Select-Object -First 1
          if ($null -eq $msi) { throw "MSI missing" }
          ./scripts/Test-MsiInstall.ps1 -MsiPath $msi.FullName

      - name: Upload MSI (no ZIP)
        uses: actions/upload-artifact@v7
        with:
          name: StreamDisplayManager-MSI
          path: release-output/*.msi
          archive: false
          if-no-files-found: error
          retention-days: 14
